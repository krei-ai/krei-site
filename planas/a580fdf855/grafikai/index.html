  function forget() { try { localStorage.removeItem(KEY); } catch (err) {} root.classList.remove('unlocking'); }
  function remember(key) { crypto.subtle.exportKey('raw', key).then(function (raw) { try { localStorage.setItem(KEY, ab64(raw)); } catch (err) {} }); }
  function viaHash() {
    if (!HU || hp.length < MINH) return;
    root.classList.add('unlocking');
    derive(hp).then(function (key) { return open(key).then(function () { remember(key); }); }).catch(function () { root.classList.remove('unlocking'); });
    setTimeout(function () { root.classList.remove('unlocking'); }, 8000);
  }
  if (saved) {
    crypto.subtle.importKey('raw', b64(saved), { name: 'AES-GCM' }, true, ['decrypt']).then(open).catch(function () { forget(); viaHash(); });
    setTimeout(function () { root.classList.remove('unlocking'); }, 6000);
  } else viaHash();
  ready(function () {
    var f = document.getElementById('f'); if (!f) return;
    var p = document.getElementById('p'), e = document.getElementById('e'), b = document.getElementById('b');
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      e.textContent = ''; b.disabled = true; b.textContent = 'Atrakinama…';
      derive(p.value.trim()).then(function (key) {
        return open(key).then(function () { remember(key); });
      }).catch(function () {
        e.textContent = 'Neteisingas slaptažodis.'; b.disabled = false; b.textContent = 'Atidaryti'; p.select();
      });
    });
  });
})();
</script>
