<!doctype html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="krei klausimynas po pirmo susitikimo: jūsų skyrių darbai ir procesai, iš kurių paruošime strategiją, pasiūlymą ir demonstraciją.">
  <meta name="theme-color" content="#F2F0ED">
  <title>Klausimynas · krei</title>
  <link rel="icon" type="image/svg+xml" href="img/krei-mark-tile.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="nustatymai.js" defer></script>
  <script src="zenklas.js" defer></script>
  <script src="skaiciuokle.js" defer></script>
  <script src="klausimai.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#klausimynas">Pereiti prie klausimų</a>
  <section id="link-state" class="link-state" role="status" aria-live="polite" hidden></section>
  <header class="topbar" hidden>
    <div class="topbar-inner">
      <a href="#pradzia" class="brand" aria-label="Į pradžią"><img src="img/krei-lockup.svg" width="105" height="32" alt=""></a>
      <div class="counter"><p class="counter-text"><span class="person" id="person"></span><span class="counter-sep" aria-hidden="true">·</span><span id="progress-text"></span></p><progress id="progress" max="1" value="0" aria-hidden="true"></progress></div>
    </div>
  </header>
  <main id="pradzia" class="shell" hidden>
    <div class="work">
      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title">Klausimynas</h1>
        <p class="promise"></p>
        <p id="already-sent" class="secondary-note"></p>
        <a class="primary hero-link" href="#klausimynas" data-start-questionnaire>Pildyti klausimyną <span data-icon="arrow-right"></span></a>
      </section>
      <aside class="flow-panel" aria-label="Kam naudosime atsakymus">
        <svg class="flow" viewBox="0 0 320 330" aria-hidden="true" focusable="false">
          <g class="flow-part" id="flow-darbai">
            <path class="flow-wire" d="M116 89 C152 89 150 160 160 160"/>
            <rect class="flow-tile" x="20" y="30" width="96" height="118" rx="16"/>
            <rect class="flow-bar" x="38" y="58" width="60" height="8" rx="4"/>
            <rect class="flow-bar is-soft" x="38" y="78" width="44" height="8" rx="4"/>
            <rect class="flow-bar is-soft" x="38" y="98" width="54" height="8" rx="4"/>
            <rect class="flow-bar is-soft" x="38" y="118" width="32" height="8" rx="4"/>
            <circle class="flow-dot" cx="116" cy="89" r="6"/>
          </g>
          <g class="flow-part" id="flow-pirmas">
            <path class="flow-wire" d="M116 226 C152 226 150 160 160 160"/>
            <rect class="flow-tile" x="20" y="178" width="96" height="96" rx="16"/>
            <path class="flow-grid" d="M40 210H96M40 234H96M40 258H96M58 198V262M78 198V262"/>
            <circle class="flow-dot" cx="116" cy="226" r="6"/>
          </g>
          <g class="flow-part" id="flow-aprasymas">
            <path class="flow-wire" d="M232 160 C262 160 257 214 257 244"/>
            <rect class="flow-tile" x="210" y="244" width="94" height="76" rx="14"/>
            <rect class="flow-bar" x="226" y="264" width="44" height="8" rx="4"/>
            <rect class="flow-bar is-soft" x="226" y="282" width="62" height="8" rx="4"/>
          </g>
          <circle class="flow-node" cx="196" cy="160" r="38"/>
          <text class="flow-label" x="196" y="170" text-anchor="middle">DI</text>
        </svg>
        <div id="uses"></div>
        <dl class="dates" id="dates"></dl>
      </aside>
      <section class="questionnaire" id="klausimynas" aria-labelledby="questionnaire-title">
        <div class="questionnaire-header"><h2 id="questionnaire-title" tabindex="-1">Klausimai</h2><p id="save-status" role="status" aria-live="polite"></p></div>
        <p class="questionnaire-intro" id="questionnaire-intro"></p>
        <div id="panels"></div>
        <div id="finish" class="finish"><p id="answered-count" role="status"></p><div id="missing" class="missing" role="alert" hidden></div><p id="edited-note" class="secondary-note" role="status"></p><div class="finish-note"><p id="submission-note" class="secondary-note"></p><p id="send-message" role="status" aria-live="polite"></p><div class="finish-actions"><p id="required-hint" class="required-hint" hidden></p><button type="button" class="secondary" id="send-retry" hidden></button><button type="button" class="secondary" id="finish-download" hidden></button><button type="button" class="primary" id="submit">Pateikti <span data-icon="arrow-right"></span></button></div></div></div>
        <section id="done" class="done" hidden aria-labelledby="done-title"><span class="done-mark" data-icon="check"></span><h3 id="done-title" tabindex="-1">Atsakymai gauti.</h3><p id="done-note"></p><div class="done-actions"><button type="button" class="secondary" id="download"><span data-icon="download"></span>Atsisiųsti atsakymus</button></div><a class="text-link" href="#klausimynas">Grįžti prie atsakymų</a></section>
      </section>
    </div>
  </main>
  <footer class="shell site-footer" id="footer" hidden></footer>
  <noscript>Įjunkite „JavaScript“, kad galėtumėte pildyti klausimyną.</noscript>
</body>
</html>
